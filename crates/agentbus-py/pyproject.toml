[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "agentbus"
version = "0.1.0"
description = "Python bindings for libagentbus: submit and serve tasks over D-Bus"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
