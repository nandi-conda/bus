[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "agentbus"
version = "0.1.0"
description = "Networked procs on D-Bus: functions, topics and broadcast signals"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# Public procs: WelcomeMat RSA keys for rookery, and checking inter-service JWTs.
public = ["cryptography>=42"]

[tool.maturin]
python-source = "python"
module-name = "agentbus._native"
features = ["pyo3/extension-module"]
