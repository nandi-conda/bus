[workspace]
name = "bus"
version = "0.1.0"
description = "libagentbus: networked procs on D-Bus, with Python bindings"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
maturin = ">=1.9,<2"
rust = ">=1.85"
dbus = "*"
cryptography = ">=42"

[tasks]
build = "cargo build --workspace"
develop = "maturin develop --release -m crates/agentbus-py/Cargo.toml"
wheel = "maturin build --release -m crates/agentbus-py/Cargo.toml"
hub = { cmd = "python examples/hub.py", depends-on = ["develop"] }
weather = { cmd = "python examples/weather.py", depends-on = ["develop"] }
ui = { cmd = "python examples/ui.py", depends-on = ["develop"] }
app = { cmd = "python examples/app.py", depends-on = ["develop"] }
watch = { cmd = "python examples/watch.py", depends-on = ["develop"] }
# Hub + weather proc + an app that calls weather.current and follows weather.* for Berlin.
demo = { cmd = "dbus-run-session -- python examples/procs_demo.py", depends-on = ["develop"] }
test-rust = "dbus-run-session -- cargo test --workspace"
test-py = { cmd = "dbus-run-session -- python -m unittest discover -s tests -v", depends-on = ["develop"] }
test = { depends-on = ["test-rust", "test-py"] }

[feature.gui.dependencies]
pyside6 = ">=6.7"

[feature.gui.tasks]
# File -> Open GUI: broadcasts GetFiles, lists every provider's SendFiles reply.
files-demo = { cmd = "dbus-run-session -- python examples/files/demo.py", depends-on = ["develop"] }

[environments]
gui = ["gui"]
