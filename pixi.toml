[workspace]
name = "bus"
version = "0.1.0"
description = "libagentbus: tasks over D-Bus, with Python bindings"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.13.*"
maturin = ">=1.9,<2"
rust = ">=1.85"
dbus = "*"

[tasks]
build = "cargo build --workspace"
develop = "maturin develop --release -m crates/agentbus-py/Cargo.toml"
wheel = "maturin build --release -m crates/agentbus-py/Cargo.toml"
greeter = { cmd = "python examples/greeter.py", depends-on = ["develop"] }
router = { cmd = "python examples/router.py", depends-on = ["develop"] }
agent = { cmd = "python examples/agent.py", depends-on = ["develop"] }
sender = { cmd = "python examples/sender.py", depends-on = ["develop"] }
topics-hub = { cmd = "python examples/topics_hub.py", depends-on = ["develop"] }
watch = { cmd = "python examples/watch.py", depends-on = ["develop"] }
# Router + agent + sender on a private bus.
demo = { cmd = "dbus-run-session -- python examples/demo.py", depends-on = ["develop"] }
# Topics hub + weather source + an app watching Berlin (all Python), on a private bus.
topics-demo = { cmd = "dbus-run-session -- scripts/topics-demo.sh", depends-on = ["develop"] }
test-rust = "dbus-run-session -- cargo test --workspace"
test-py = { cmd = "dbus-run-session -- python -m unittest discover -s tests -v", depends-on = ["develop"] }
test = { depends-on = ["test-rust", "test-py"] }

[feature.gui.dependencies]
pyside6 = ">=6.7"

[feature.gui.tasks]
# File -> Open GUI: broadcasts GetFiles, lists every provider's SendFiles reply.
files-demo = "dbus-run-session -- scripts/files_demo.sh"

[environments]
gui = ["gui"]
